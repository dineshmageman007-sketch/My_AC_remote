name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify IR encoder against reference frames
        run: python3 -I tools/verify_encoder.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_HOME is set),
      # so no separate setup-android step is needed.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ac-remote-apk
          path: app/build/outputs/apk/debug/app-debug.apk
